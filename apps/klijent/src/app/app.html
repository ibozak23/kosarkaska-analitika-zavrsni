<header>
  <h1 class="brand">
    <a routerLink="/">Košarkaška analitika</a>
  </h1>

  <nav>
    <a routerLink="/timovi" routerLinkActive="active">
      <svg class="icon icon-accent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="9" cy="8" r="3" />
        <path d="M3.5 20c0-3.6 2.5-6 5.5-6s5.5 2.4 5.5 6" />
        <path d="M16 9a2.4 2.4 0 1 0 0-4.8" />
        <path d="M16.5 14c2.4.3 4 2.3 4 6" />
      </svg>
      Timovi
    </a>
    <a routerLink="/igraci" routerLinkActive="active">
      <svg class="icon icon-accent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="8" r="3.6" />
        <path d="M5 20c0-3.9 3.1-6.5 7-6.5s7 2.6 7 6.5" />
      </svg>
      Igrači
    </a>
    <a routerLink="/utakmice" routerLinkActive="active">
      <svg class="icon icon-accent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="8" />
        <path
          d="M12 4v16M4 12h16M6.3 6.3c1.8 1.6 2.8 3.6 2.8 5.7s-1 4.1-2.8 5.7M17.7 6.3c-1.8 1.6-2.8 3.6-2.8 5.7s1 4.1 2.8 5.7"
        />
      </svg>
      Utakmice
    </a>
    <a routerLink="/uvoz" routerLinkActive="active">
      <svg class="icon icon-accent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3v11" />
        <path d="M8 10l4 4 4-4" />
        <path d="M5 19h14" />
      </svg>
      Uvoz
    </a>
  </nav>

  <button
    type="button"
    class="theme-toggle"
    [attr.title]="themeLabel()"
    [attr.aria-label]="themeLabel()"
    (click)="toggleTheme()"
  >
    <svg
      class="sun"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.6"
      stroke-linecap="round"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="4" />
      <path
        d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
      />
    </svg>
    <svg
      class="moon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.6"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
    </svg>
  </button>
</header>

<main>
  <router-outlet />
</main>
